Base:
  model_root: ./runs_local/checkpoints_rankmixer_multiseed/
  num_workers: 4
  verbose: 1
  early_stop_patience: 2
  pickle_feature_encoder: true
  save_best_only: true
  eval_steps: null
  debug_mode: false
  group_id: user_id
  use_features: null
  feature_specs: null
  feature_config: null
  dense_optimizer: AdamW
  sparse_optimizer: Adagrad
  dense_learning_rate: 0.0001
  sparse_learning_rate: 0.05
  dense_weight_decay: 0
  enable_torch_compile: true
  gradient_checkpointing: false
  hidden_analysis_batches: 1
  hidden_analysis_samples: 8192
  hidden_analysis_projection_dim: 64
  hidden_analysis_dir: ./runs_local/hidden_analysis_multiseed
RankMixer_LinearDeep_Seed20262028:
  accumulation_steps: 1
  attention_dropout: 0
  auxiliary_loss_weight: 0.5
  batch_size: 8192
  dataset_id: Taobao_Action
  embedding_dim: 16
  epochs: 1
  expansion_factor: 2
  loop_gate_init: 0.5
  loop_scope: refinement
  loop_topology: linear
  loss: &id001
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  max_len: 100
  metrics: &id002
  - logloss
  - AUC
  model: RankMixer
  model_type: looped
  monitor: &id003
    AUC: 1
    logloss: 0
  monitor_mode: max
  net_dropout: 0
  num_layers: 3
  num_loops: 4
  num_ns_token: 4
  num_tasks: 4
  seed: 20262028
  share_loop_parameters: true
  shuffle: true
  supervision_mode: deep_progressive
  task: binary_classification
  task_token_mode: none
  token_dim: 256
  tokenizer_type: Chunk
  tower_activations: ReLU
  tower_hidden_units: &id004
  - 128
  - 64
  use_behavior_embedding: true
  use_loop_gate: false
