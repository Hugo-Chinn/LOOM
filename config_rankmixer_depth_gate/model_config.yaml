Base:
  debug_mode: false
  dense_learning_rate: 0.0001
  dense_optimizer: AdamW
  dense_weight_decay: 0
  early_stop_patience: 2
  enable_torch_compile: true
  eval_steps: null
  feature_config: null
  feature_specs: null
  gradient_checkpointing: false
  group_id: user_id
  model_root: ./runs_local/checkpoints_rankmixer_depth_gate/
  num_workers: 4
  pickle_feature_encoder: true
  save_best_only: true
  sparse_learning_rate: 0.05
  sparse_optimizer: Adagrad
  use_features: null
  verbose: 1
RankMixer_Taobao_Branch_Control:
  accumulation_steps: 1
  attention_dropout: 0
  auxiliary_loss_weight: 0.5
  batch_size: 8192
  dataset_id: Taobao_Action
  embedding_dim: 16
  epochs: 1
  expansion_factor: 2
  loop_gate_init: 0.5
  loop_scope: refinement
  loop_topology: branch
  loss:
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  max_len: 100
  metrics:
  - logloss
  - AUC
  model: RankMixer
  model_type: looped
  monitor:
    AUC: 1
    logloss: 0
  monitor_mode: max
  net_dropout: 0
  num_layers: 3
  num_loops: 4
  num_ns_token: 4
  num_tasks: 4
  seed: 20262028
  share_loop_parameters: true
  shuffle: true
  supervision_mode: deep_progressive
  task: binary_classification
  task_token_mode: none
  token_dim: 256
  tokenizer_type: Chunk
  tower_activations: ReLU
  tower_hidden_units:
  - 128
  - 64
  use_behavior_embedding: true
  use_loop_gate: false
  use_depth_loop_gate: false
