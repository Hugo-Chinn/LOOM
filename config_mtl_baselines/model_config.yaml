Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: user_id
    use_features: null
    feature_specs: null
    feature_config: null
    dense_optimizer: AdamW
    sparse_optimizer: Adagrad
    dense_learning_rate: 1.0e-4
    sparse_learning_rate: 0.05
    dense_weight_decay: 0
    enable_torch_compile: True
    gradient_checkpointing: False


SharedBottom_TencentGR:
    model: SharedBottom
    dataset_id: TencentGR_10M_Action
    loss:
        - binary_crossentropy
        - binary_crossentropy
    num_tasks: 2
    metrics:
        - logloss
        - AUC
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    token_dim: 256
    num_ns_token: 4
    tokenizer_type: Chunk
    tower_hidden_units:
        - 128
        - 64
    tower_activations: ReLU
    attention_dropout: 0
    net_dropout: 0
    num_layers: 3
    expansion_factor: 2
    epochs: 1
    shuffle: true
    seed: 20262031
    monitor:
        AUC: 1
        logloss: 0
    monitor_mode: max
    max_len: 100
    accumulation_steps: 1
    bottom_type: mlp
    bottom_hidden_units:
        - 256
        - 128

