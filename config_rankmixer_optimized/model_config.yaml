Base:
  model_root: ./runs_local/checkpoints_rankmixer_optimized/
  num_workers: 4
  verbose: 1
  early_stop_patience: 2
  pickle_feature_encoder: true
  save_best_only: true
  eval_steps: null
  debug_mode: false
  group_id: user_id
  use_features: null
  feature_specs: null
  feature_config: null
  dense_optimizer: AdamW
  sparse_optimizer: Adagrad
  dense_learning_rate: 1.0e-4
  sparse_learning_rate: 0.05
  dense_weight_decay: 0
  enable_torch_compile: true
  gradient_checkpointing: false

RankMixer_Gated_Linear: &base_loop
  model: RankMixer
  dataset_id: Taobao_Action
  loss: [binary_crossentropy, binary_crossentropy, binary_crossentropy, binary_crossentropy]
  num_tasks: 4
  metrics: [logloss, AUC]
  task: binary_classification
  batch_size: 8192
  embedding_dim: 16
  num_layers: 3
  expansion_factor: 2
  token_dim: 256
  num_ns_token: 4
  tokenizer_type: Chunk
  tower_hidden_units: [128, 64]
  tower_activations: ReLU
  attention_dropout: 0
  net_dropout: 0
  epochs: 1
  shuffle: true
  seed: 20262027
  monitor: {AUC: 1, logloss: 0}
  monitor_mode: max
  max_len: 100
  accumulation_steps: 1
  model_type: looped
  num_loops: 4
  share_loop_parameters: true
  use_behavior_embedding: true
  task_token_mode: none
  loop_scope: refinement
  loop_topology: linear
  use_loop_gate: true
  loop_gate_init: 0.5
  supervision_mode: progressive

RankMixer_Gated_Linear_Deep:
  <<: *base_loop
  supervision_mode: deep_progressive
  auxiliary_loss_weight: 0.5

RankMixer_Branch:
  <<: *base_loop
  loop_topology: branch
  use_loop_gate: false
  supervision_mode: deep_progressive
  auxiliary_loss_weight: 0.5

RankMixer_Branch_Gated: &branch_gated
  <<: *base_loop
  loop_topology: branch
  use_loop_gate: true
  supervision_mode: deep_progressive
  auxiliary_loss_weight: 0.5

RankMixer_Branch_Gated_StepReg:
  <<: *branch_gated
  loop_step_reg_weight: 0.05
  loop_step_margin: 0.0

RankMixer_Branch_Gated_StepVarReg:
  <<: *branch_gated
  loop_step_reg_weight: 0.05
  loop_step_margin: 0.0
  loop_variance_reg_weight: 0.01
  loop_variance_floor: 0.5
