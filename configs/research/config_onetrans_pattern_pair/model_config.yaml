  - binary_crossentropy
  - binary_crossentropy
  - binary_crossentropy
  max_len: 100
  metrics: &id002
  - logloss
  - AUC
  model: OneTrans
  model_type: base_refiner
  monitor: &id003
    AUC: 1
    logloss: 0
  monitor_mode: max
  net_dropout: 0
  num_heads: 2
  num_layers: 3
  num_loops: 4
  num_ns_token: 4
  num_tasks: 4
  num_workers: 4
  peft_alpha: 4.0
  peft_dropout: 0.0
  peft_rank: 4
  peft_type: lora_qv
  reduction_ratio: 0.5
  refiner_gate_init: 0.1
  refiner_num_layers: 1
  seed: 20262027
  share_loop_parameters: true
  shuffle: true
  supervision_mode: progressive
  task: binary_classification
  token_dim: 256
  tokenizer_type: Auto
  tower_activations: ReLU
  tower_hidden_units: &id004
  - 128
  - 64
  use_behavior_embedding: true
  pattern_pair_loss_weight: 0.0
  pattern_no_regret_weight: 0.0
  topology_retention_weight: 0.0
