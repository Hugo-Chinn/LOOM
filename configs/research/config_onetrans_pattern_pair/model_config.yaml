  sparse_learning_rate: 0.05
  dense_weight_decay: 0
  enable_torch_compile: true
  gradient_checkpointing: false
OneTrans_Pattern_Control_Seed20262027:
  accumulation_steps: 1
  auxiliary_loss_weight: 0.5
  batch_size: 8192
  dataset_id: Taobao_Action
  dnn_activations: ReLU
  embedding_dim: 16
  enable_loop_diagnostics: false
  enable_torch_compile: false
  epochs: 1
  loop_topology: branch
  loss: &id001
